<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impression</title>
    <script>
      // Resolve the theme synchronously so the first paint is already correct.
      (function () {
        var pref = null;
        try { pref = localStorage.getItem("theme-preference"); } catch (e) {}
        var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body class="outline-hidden">
    <div id="app">
      <div id="tabbar">
        <button id="toggle-outline" type="button" title="Show/hide outline (Ctrl+Shift+O)" aria-label="Show or hide outline" aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <line x1="4" y1="6" x2="9" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="5.5" y1="8.5" x2="10.5" y2="8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="5.5" y1="11" x2="9" y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <div id="tabs" role="tablist"></div>
        <button id="tab-new" type="button" title="New file (Ctrl+N)" aria-label="New file">+</button>
        <button id="toggle-preview" type="button" title="Show/hide preview (Ctrl+Shift+P)" aria-label="Show or hide preview" aria-pressed="true">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <line x1="8" y1="2.5" x2="8" y2="13.5" stroke="currentColor" stroke-width="1.5"/>
            <rect class="pane-fill" x="8" y="2.5" width="6.5" height="11" fill="currentColor" opacity="0.35"/>
          </svg>
        </button>
      </div>
      <div id="workspace">
        <aside id="outline" aria-label="Outline">
          <div id="outline-header">Outline</div>
          <div id="outline-tree"></div>
        </aside>
        <div id="outline-resizer" title="Drag to resize the outline"></div>
        <div id="editor-pane"></div>
        <div id="resizer" title="Drag to resize, double-click to reset"></div>
        <div id="preview-pane">
          <article id="preview" class="markdown-body"></article>
        </div>
      </div>
      <div id="statusbar">
        <span id="status-path"></span>
        <span id="status-spacer"></span>
        <span id="status-cursor"></span>
        <span id="status-words"></span>
        <span id="status-font" title="Editor font size (Ctrl+Shift+. / Ctrl+Shift+, or Ctrl+wheel over the editor)"></span>
        <span id="status-zoom" title="Preview zoom (Ctrl+Shift+] / Ctrl+Shift+[ or Ctrl+wheel over the preview)"></span>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
